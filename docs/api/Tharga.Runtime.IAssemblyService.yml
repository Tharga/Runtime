  assemblies:
  - Tharga.Runtime
  namespace: Tharga.Runtime
  summary: >-
    Gets types from cache. If a filter is provided the cache can be populated on the first call, otherwise LoadTypes

    has to be called first to prepare the cache.
  example: []
  syntax:
    content: TypeInfo[] GetTypes(string cacheKey, Func<TypeInfo, bool> filter = null, Assembly baseAssembly = null)
    parameters:
    - id: cacheKey
      type: System.String
      description: Unique key for the specific cache.
    - id: filter
      type: System.Func{System.Reflection.TypeInfo,System.Boolean}
      description: Filter the types that should be loaded.
    - id: baseAssembly
      type: System.Reflection.Assembly
      description: Assembly to be used as entry point to look for types.
    return:
      type: System.Reflection.TypeInfo[]
    content.vb: Function GetTypes(cacheKey As String, filter As Func(Of TypeInfo, Boolean) = Nothing, baseAssembly As Assembly = Nothing) As TypeInfo()
