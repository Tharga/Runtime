  summary: >-
    Loads types into the cache. Then the types can be fetched using the GetServiceTypePairs (without a filter).

    See 'GetAssemblies' in 'AssemblyService' for default behaviour.
  example: []
  syntax:
    content: public void LoadTypes(string cacheKey, Func<TypeInfo, bool> filter, IEnumerable<Assembly> assemblies = null, Assembly baseAssembly = null)
    parameters:
    - id: cacheKey
      type: System.String
      description: Unique key for the specific cache.
    - id: filter
      type: System.Func{System.Reflection.TypeInfo,System.Boolean}
      description: Filter the types that should be loaded.
    - id: assemblies
      type: System.Collections.Generic.IEnumerable{System.Reflection.Assembly}
      description: Provide what assemblies should be used to find types.
    - id: baseAssembly
      type: System.Reflection.Assembly
      description: Assembly to be used as entry point to look for types.
    content.vb: Public Sub LoadTypes(cacheKey As String, filter As Func(Of TypeInfo, Boolean), assemblies As IEnumerable(Of Assembly) = Nothing, baseAssembly As Assembly = Nothing)
