  assemblies:
  - Tharga.Runtime
  namespace: Tharga.Runtime
  summary: >-
    Adds registration to the IOC by using a type filter.

    Abstract types and Interfaces are automatically filtered out for implementation.

    A good way is to use the filter in combination with 'IsOfType', then all types based on that type will be found.
  example: []
  syntax:
    content: public static void Add(this IServiceCollection services, RegistrationType registrationType, Func<TypeInfo, bool> filter, IEnumerable<Assembly> assemblies = null, Assembly baseAssembly = null, bool findInterface = true)
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: ''
    - id: registrationType
      type: Tharga.Runtime.RegistrationType
      description: Type of registration as Transient, Scoped or Singleton.
    - id: filter
      type: System.Func{System.Reflection.TypeInfo,System.Boolean}
      description: The actual type filter. Ex. x =&gt; x.IsOfType(typeof(MyService))
    - id: assemblies
      type: System.Collections.Generic.IEnumerable{System.Reflection.Assembly}
      description: An optional list of assemblies of where to look for types. If not provided the baseAssembly, or default will be used.
    - id: baseAssembly
      type: System.Reflection.Assembly
      description: Provide a base assembly of where to start looking for types. By default, EntryAssembly or ExecutingAssembly will be used.
    - id: findInterface
      type: System.Boolean
      description: If true, interface types will be automatically found based on a concrete type. If false, the concrete type is registered without an interface.
    content.vb: Public Shared Sub Add(services As IServiceCollection, registrationType As RegistrationType, filter As Func(Of TypeInfo, Boolean), assemblies As IEnumerable(Of Assembly) = Nothing, baseAssembly As Assembly = Nothing, findInterface As Boolean = True)
